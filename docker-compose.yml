# Insight AI 全栈编排（W11：基础设施 + 应用容器一体）
# 覆盖：Milvus 向量库(etcd+minio)、Neo4j 图库、Redis 状态存储、
#       backend(FastAPI)、frontend(Next.js)、mcp-*（4 个 FastMCP 工具服务）
# 一键启动：docker compose up -d --build
# 应用镜像多阶段构建（backend/Dockerfile、frontend/Dockerfile）——防镜像过大
name: insightai

services:
  # ---------- 向量数据库（GraphRAG 密集向量检索） ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: insight-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: insight-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.5.9
    container_name: insight-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  # ---------- 图数据库（GraphRAG 拓扑查询） ----------
  neo4j-graph:
    image: neo4j:5.26-community
    container_name: insight-neo4j
    environment:
      - NEO4J_AUTH=neo4j/insightai-neo4j
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"   # HTTP 浏览器控制台
      - "7687:7687"   # Bolt 驱动连接
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      start_period: 30s
      timeout: 10s
      retries: 3

  # ---------- 状态存储（HITL 检查点 / 异步任务） ----------
  # 注意：langgraph-checkpoint-redis 依赖 RediSearch/JSON 模块，
  # 官方 redis 镜像不含，必须用 redis-stack-server（同端口兼容）
  redis-state-store:
    image: redis/redis-stack-server:7.2.0-v10
    container_name: insight-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 应用：后端（FastAPI + LangGraph） ----------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 基础镜像可经 DOCKER_BASE_PY 覆盖（国内网络走加速镜像；CI 默认官方）
        BASE_PY: ${DOCKER_BASE_PY:-python:3.12-slim}
    container_name: insight-backend
    env_file: ./.env
    environment:
      # 容器网络内基础设施主机名（覆盖 .env 的 localhost）
      - MILVUS_URI=http://milvus-standalone:19530
      - NEO4J_URI=bolt://neo4j-graph:7687
      - REDIS_URL=redis://redis-state-store:6379/0
      # MCP 端点走容器内服务名（registry 自动追加 /mcp）
      - MCP_SERVERS=["http://mcp-browser:8101","http://mcp-vector:8102","http://mcp-graph:8103","http://mcp-system:8104"]
      # SQLite 数据落持久卷（避免容器重建丢库）
      - DATABASE_URL=sqlite:////app/data/insightai.db
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    depends_on:
      milvus-standalone:
        condition: service_healthy
      neo4j-graph:
        condition: service_healthy
      redis-state-store:
        condition: service_healthy
      mcp-browser:
        condition: service_started
      mcp-vector:
        condition: service_started
      mcp-graph:
        condition: service_started
      mcp-system:
        condition: service_started

  # ---------- 应用：前端（Next.js 14） ----------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 基础镜像可经 DOCKER_BASE_NODE 覆盖（国内网络走加速镜像；CI 默认官方）
        BASE_NODE: ${DOCKER_BASE_NODE:-node:20-alpine}
        # 浏览器端 API 地址（容器外访问宿主 8000）
        NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    container_name: insight-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ---------- 应用：MCP 工具服务集群（同一镜像，不同端口） ----------
  mcp-browser:
    image: insightai-backend:latest  # 与 backend 共用同一镜像（不同 command/端口）
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: insight-mcp-browser
    env_file: ./.env
    environment:
      - MILVUS_URI=http://milvus-standalone:19530
      - NEO4J_URI=bolt://neo4j-graph:7687
      - REDIS_URL=redis://redis-state-store:6379/0
    command: ["python", "/app/mcp_servers/browser_mcp.py", "--host", "0.0.0.0", "--port", "8101"]
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8101/mcp"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    ports:
      - "8101:8101"
    depends_on:
      milvus-standalone:
        condition: service_healthy
      neo4j-graph:
        condition: service_healthy
      redis-state-store:
        condition: service_healthy

  mcp-vector:
    image: insightai-backend:latest  # 与 backend 共用同一镜像（不同 command/端口）
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: insight-mcp-vector
    env_file: ./.env
    environment:
      - MILVUS_URI=http://milvus-standalone:19530
      - NEO4J_URI=bolt://neo4j-graph:7687
      - REDIS_URL=redis://redis-state-store:6379/0
    command: ["python", "/app/mcp_servers/vector_mcp.py", "--host", "0.0.0.0", "--port", "8102"]
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8102/mcp"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    ports:
      - "8102:8102"
    depends_on:
      milvus-standalone:
        condition: service_healthy
      neo4j-graph:
        condition: service_healthy
      redis-state-store:
        condition: service_healthy

  mcp-graph:
    image: insightai-backend:latest  # 与 backend 共用同一镜像（不同 command/端口）
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: insight-mcp-graph
    env_file: ./.env
    environment:
      - MILVUS_URI=http://milvus-standalone:19530
      - NEO4J_URI=bolt://neo4j-graph:7687
      - REDIS_URL=redis://redis-state-store:6379/0
    command: ["python", "/app/mcp_servers/graph_mcp.py", "--host", "0.0.0.0", "--port", "8103"]
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8103/mcp"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    ports:
      - "8103:8103"
    depends_on:
      milvus-standalone:
        condition: service_healthy
      neo4j-graph:
        condition: service_healthy
      redis-state-store:
        condition: service_healthy

  mcp-system:
    image: insightai-backend:latest  # 与 backend 共用同一镜像（不同 command/端口）
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: insight-mcp-system
    env_file: ./.env
    environment:
      - MILVUS_URI=http://milvus-standalone:19530
      - NEO4J_URI=bolt://neo4j-graph:7687
      - REDIS_URL=redis://redis-state-store:6379/0
    command: ["python", "/app/mcp_servers/system_mcp.py", "--host", "0.0.0.0", "--port", "8104"]
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8104/mcp"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    ports:
      - "8104:8104"
    depends_on:
      milvus-standalone:
        condition: service_healthy
      neo4j-graph:
        condition: service_healthy
      redis-state-store:
        condition: service_healthy

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  neo4j-data:
  redis-data:
  backend-data:
