[project]
name = "insight-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "browser-use>=0.11.13",
    "curl-cffi>=0.16.0",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.6",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-redis>=0.5.1",
    "neo4j>=6.2.0",
    "playwright>=1.62.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pymilvus>=3.0.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis<8",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.4",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
# W10 覆盖率门槛：uv run pytest --cov=app 低于 80% 时失败（CI 固化）
cov_fail_under = "80"

[tool.ruff]
target-version = "py312"
line-length = 100
# W11：CI 引入 ruff；排除测试与脚本目录的次要规则噪音
exclude = ["tests", "scripts", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G", "RUF", "S", "PERF", "PIE", "TRY", "DTZ"]
# B008：FastAPI 依赖注入以 Depends(...) 作默认参数是官方惯例，非缺陷
# S110 try-except-pass：基础设施降级路径属有意为之
# RUF001/002/003：中文注释/字符串/文档中的 Unicode 是项目常态，非"歧义字符"
# E501：业务含长 LLM Prompt/SQL 串，统一交给 ruff format 排版
# TRY003：业务 raise ValueError("中文信息") 无需带错误类名前缀
# S105：jwt_secret/neo4j_password 等为开发默认值（生产经 .env 覆盖），非硬编码凭据
# S311/S324：随机节流延迟 / 文件名 md5 哈希均非加密用途
# TRY301：采集/降级路径内 raise 语义清晰，抽象化反而降低可读性
ignore = ["B008", "S110", "RUF001", "RUF002", "RUF003", "E501", "TRY003",
          "S105", "S311", "S324", "TRY301"]
