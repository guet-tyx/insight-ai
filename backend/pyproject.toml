[project]
name = "insight-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "browser-use>=0.11.13",
    "curl-cffi>=0.16.0",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.6",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-redis>=0.5.1",
    "neo4j>=6.2.0",
    "playwright>=1.62.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pymilvus>=3.0.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis<8",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.4",
]

[tool.pytest.ini_options]
# W10 覆盖率门槛：uv run pytest --cov=app 低于 80% 时失败（CI 固化）
cov_fail_under = "80"
